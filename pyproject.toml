[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nebosvod-sdk"
version = "0.1.0.dev0"
description = "Public toolkit for building computational modules for Nebosvod."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "PyYAML>=6.0.2",
    "types-PyYAML>=6.0.12.20241230",
]

[tool.hatch.build.targets.wheel]
packages = ["python/nebosvod_sdk"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "tests/acceptance"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
files = ["python", "tests"]
