# Nebosvod Python style. See CONTRIBUTING.md.
line-length = 110
target-version = "py312"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "D", "NPY", "PLE", "PLW", "PERF", "RET", "TID"]
ignore = ["D100", "D104", "D105", "D107"]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
known-first-party = ["nebosvod", "nebosvod_sdk"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
